name: luxefinds_client
description: LuxeFinds Mobile Client App - Premium e-commerce platform for luxury accessories.

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  
  # HTTP Client
  dio: ^5.3.1
  
  # Secure Storage
  flutter_secure_storage: ^10.0.0
  
  # Navigation
  go_router: ^15.1.2
  
  # UI & Forms
  flutter_form_builder: ^10.3.0+1
  form_builder_validators: ^11.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  intl: ^0.20.0
  
  # Utilities
  freezed_annotation: ^2.4.1
  json_serializable: ^6.7.1
  json_annotation: ^4.8.1
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Testing & Mocking
  mockito: ^5.4.4
  integration_test:
    sdk: flutter
  
  # Linting & Code Generation
  flutter_lints: ^4.0.0
  build_runner: ^2.4.6
  riverpod_generator: ^2.3.0
  freezed: ^2.4.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Alegreya
      fonts:
        - asset: assets/fonts/Alegreya-Regular.ttf
        - asset: assets/fonts/Alegreya-Bold.ttf
          weight: 700
