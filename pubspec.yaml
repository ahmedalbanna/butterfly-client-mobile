name: luxefinds_admin
description: LuxeFinds Admin Application - Manage products, orders, and more.

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  
  # HTTP Client
  dio: ^5.3.1
  
  # Secure Storage
  flutter_secure_storage: ^9.0.0
  
  # Biometric Authentication
  local_auth: ^2.1.7
  
  # Navigation
  go_router: ^13.0.0
  
  # UI & Forms
  flutter_form_builder: ^10.3.0+1
  form_builder_validators: ^11.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # Charts and data visualization
  fl_chart: ^0.64.0
  
  # Image Picker
  image_picker: ^1.0.4
  
  # Utilities
  freezed_annotation: ^2.4.1
  json_serializable: ^6.7.1
  json_annotation: ^4.8.1
  logger: ^2.0.0
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  riverpod_generator: ^2.3.0
  
  # Integration testing
  integration_test:
    sdk: flutter
  mockito: ^5.4.2
  http_mock_adapter: ^0.6.0

flutter:
  uses-material-design: true
  
  # Fonts
  fonts:
    - family: Alegreya
      fonts:
        - asset: assets/fonts/Alegreya-Regular.ttf
        - asset: assets/fonts/Alegreya-Bold.ttf
          weight: 700
  
